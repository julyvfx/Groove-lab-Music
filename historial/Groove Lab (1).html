<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Groove Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
:root{--bg:#eaf0fa;--bg2:#dde7f6;--pn:#fff;--ln:#b9c9e6;--tx:#0d1f40;--mu:#566a93;--ac:#0a86c8;--gr:#2f9a52;--rd:#c05555;--vi:#6a64c4;--or:#d9762a;--cell:#cfdaee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07122b;--bg2:#0b1b3d;--pn:#10264f;--ln:#1e3a6e;--tx:#e8f0ff;--mu:#8fa6d0;--ac:#19a7ee;--gr:#4fb06a;--rd:#c96b6b;--vi:#8c86d9;--or:#f08a3c;--cell:#16305c}}
:root[data-theme="dark"]{--bg:#07122b;--bg2:#0b1b3d;--pn:#10264f;--ln:#1e3a6e;--tx:#e8f0ff;--mu:#8fa6d0;--ac:#19a7ee;--gr:#4fb06a;--rd:#c96b6b;--vi:#8c86d9;--or:#f08a3c;--cell:#16305c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--pn);border:1.5px solid var(--ln);border-radius:20px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
select,input[type=text],input[type=number]{background:var(--pn);border:1.5px solid var(--ln);border-radius:16px;padding:5px 10px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--ln)}
.logo{font:300 30px/1 "Trebuchet MS",sans-serif;letter-spacing:-1px}.logo b{font-weight:700;color:var(--ac)}
.meta{color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border-radius:6px;border-color:transparent;background:transparent;color:var(--mu)}
nav button.on{background:var(--pn);color:var(--ac);border-color:var(--ac)}
.tp{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px}
.rb{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px;display:grid;place-items:center}
#bPlay{border-color:var(--ac);color:var(--ac);width:54px;height:54px}
.pill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ln);border-radius:26px;padding:4px 12px;background:var(--pn)}
.pill small{color:var(--ac);font-weight:700}.pill select,.pill input{border:0;background:transparent;padding:2px}
#bpm{width:58px}
main{padding:0 18px 30px}
h2{font-size:19px;margin:6px 0 4px;font-weight:600}p.sub{color:var(--mu);margin:0 0 12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:14px}
.sc{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:var(--bg2)}
.grid{position:relative;display:inline-block;min-width:100%}
.row{display:flex;height:34px;align-items:stretch}.row.l{height:44px}
.lb{position:sticky;left:0;z-index:3;width:110px;flex:none;background:var(--pn);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px}
.lb button{padding:0 6px;border-radius:5px;font-size:11px}
.c{width:72px;flex:none;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);position:relative;text-align:center;color:var(--mu);font-size:11px;line-height:34px;cursor:pointer}
.c.s0{border-left:2px solid var(--ac)}
.secb{flex:none;border-right:2px solid var(--bg);color:#fff;padding:6px 8px;font-size:12px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--ln)}
.secb.sel{outline:2px solid var(--tx);outline-offset:-3px}
.ch{width:72px;flex:none;border:0;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);background:var(--pn);text-align:center;border-radius:0;font-weight:700;color:var(--ac);padding:0}
.ch.s0{border-left:2px solid var(--ac)}
.b i{position:absolute;width:4px;height:5px;border-radius:1px;background:var(--k)}
#cur{position:absolute;top:0;bottom:0;width:2px;background:var(--or);z-index:4;pointer-events:none;left:110px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border-radius:6px;padding:4px 10px}
.gr{display:flex;align-items:center;gap:3px;margin-bottom:3px}.gl{width:84px;flex:none;color:var(--mu);font-size:12px}
.st{width:34px;height:28px;border-radius:3px;background:var(--cell);cursor:pointer;flex:none}
.st.q{margin-left:5px}.st.on{background:var(--c)}.st.ph{outline:2px solid var(--or)}
.pad{overflow-x:auto;padding-bottom:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--cell);color:var(--mu)}
.sp{flex:1}
</style></head><body>
<header>
<div class="logo">groove<b>lab</b></div>
<div class="meta" id="meta"></div>
<nav id="nav"></nav>
</header>
<div class="tp">
<button class="rb" id="bPlay" onclick="togglePlay()" aria-label="Reproducir">▶</button>
<button class="rb" onclick="stopAll()" aria-label="Detener">■</button>
<button class="rb" id="bLoop" onclick="toggleLoop()" title="Repetir la sección seleccionada" aria-label="Repetir sección">⟳</button>
<button class="rb" id="bMet" onclick="toggleMet()" title="Metrónomo" aria-label="Metrónomo">♩</button>
<div class="pill"><small>TONALIDAD</small><select id="key" onchange="setKey()"></select><select id="mode" onchange="setKey()"><option value="">Mayor</option><option value="m">Menor</option></select></div>
<div class="pill"><small>BPM</small><input type="number" id="bpm" min="50" max="220" onchange="setBpm()"></div>
<div class="pill"><small>COMPÁS</small><select id="ts" onchange="setTs()"><option>4/4</option><option>3/4</option><option>5/4</option><option>6/8</option></select></div>
<div class="pill"><small>A4</small><input type="number" id="tune" min="400" max="480" style="width:56px" onchange="S.tune=+this.value||440"></div>
<div class="pill"><small>GÉNERO</small><select id="gen" onchange="setGen()" style="max-width:150px"></select><select id="sub" onchange="setSub()" style="max-width:140px"></select></div>
<div class="pill"><small>VOL</small><input type="range" id="vol" min="-30" max="0" value="-6" oninput="Tone.Destination.volume.value=+this.value"></div>
<div class="pill" id="pos">Compás 1</div>
<div class="sp"></div>
<div class="pill"><select id="saved" onchange="openProj(this.value)" aria-label="Abrir canción"><option value="">Abrir…</option></select></div>
<button onclick="saveProj()">Guardar</button><button onclick="newProj()">Nueva</button>
</div>
<main id="main"></main>
<datalist id="dl"></datalist>
<script>
const $=s=>document.querySelector(s),W=72,KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const T=[['drums','Drums','--vi'],['bass','Bass','--rd'],['skank','Guitar Skank','--or'],['organ','Organ Bubble','--ac'],['melody','Melody','--gr']];
const DR=[['kick','Kick'],['snare','Snare'],['rim','Rimshot'],['hat','Hi-hat'],['ohat','Open hat'],['shaker','Shaker'],['conga','Conga'],['tom','Tom']];
const mk=(...a)=>{const r=Array(16).fill(0);a.forEach(i=>r[i]=1);return r},mv=o=>{const r=Array(16).fill(0);for(const k in o)r[k]=o[k];return r};
const H8=[0,2,4,6,8,10,12,14];
const dp=(o)=>Object.fromEntries(DR.map(([k])=>[k,o[k]||mk()]));
function defPats(){return{
drums:{A:dp({kick:mk(0,8),snare:mk(4,12),hat:mk(...H8)}),B:dp({kick:mk(0,6,8),snare:mk(4,12),hat:mk(...H8),ohat:mk(14),shaker:mk(1,3,5,7,9,11,13,15)}),C:dp({kick:mk(8),rim:mk(8),hat:mk(...H8),conga:mk(3,6,11)}),D:dp({kick:mk(0,8),snare:mk(8,10,12,13,14,15),hat:mk(0,4,8),tom:mk(12,14)})},
bass:{A:mv({0:1,6:1,8:2,10:1}),B:mv({0:1,3:1,6:2,8:1,12:3}),C:mv({0:1,8:1}),D:mv({0:1,4:4,8:2,12:3})},
skank:{A:mk(4,12),B:mk(2,6,10,14),C:mk(4,6,12,14),D:mk(6,14)},
organ:{A:mk(0,3,6,8,11,14),B:mk(...H8),C:mk(3,7,11,15),D:mk(0,3,4,7,8,11,12,15)},
melody:{A:mv({0:1,3:3,5:5,8:3,11:2,13:1}),B:mv({0:1,2:2,4:3,6:4,8:5,10:6,12:7,14:8}),C:mv({0:8,2:7,4:6,6:5,8:4,10:3,12:2,14:1}),D:mv({0:1,3:5,6:8,8:5,11:3,14:1})}}}
const mkS=(n,b,c,ch,p={})=>({n,b,c,ch:Array.from({length:b},(_,i)=>ch[i%ch.length]),p:{drums:'A',bass:'A',skank:'A',organ:'A',melody:'A',...p}});
function defS(){const V=['F#m','C#m','D','E'],C=['A','E','F#m','D'],cc={drums:'B',bass:'B',skank:'B',organ:'B',melody:'B'};return{name:'Mi canción',bpm:124,key:6,mode:'m',ts:'4/4',sel:1,
secs:[mkS('Intro',4,'#6f7fd6',V,{drums:'C',melody:'C'}),mkS('Verso A',8,'#2f95b8',V),mkS('Pre-coro',4,'#c9962f',['D','E'],{drums:'D',bass:'B'}),mkS('Coro',8,'#b95a3a',C,cc),mkS('Verso B',8,'#2f95b8',V,{bass:'C'}),mkS('Coro final',8,'#b95a3a',C,{...cc,bass:'D',organ:'D',melody:'D'}),mkS('Outro',4,'#6f7fd6',V,{drums:'C'})],
pats:defPats(),snd:{bass:'saw',skank:'guitar',organ:'organ',melody:'lead'},mute:{}}}
let S=defS(),view='vis',P={step:0,playing:false,loop:false,solo:null,met:false},LIB=[],SMP={};
const SPBM={'4/4':16,'3/4':12,'5/4':20,'6/8':12},SPB=()=>SPBM[S.ts],total=()=>S.secs.reduce((a,s)=>a+s.b,0);
const pat=(t,v)=>S.pats[t][v],cur=t=>pat(t,S.secs[S.sel].p[t]);
const kn=()=>KEYS[S.key]+S.mode;
function info(bar){let a=0;for(let i=0;i<S.secs.length;i++){const s=S.secs[i];if(bar<a+s.b)return{i,s,l:bar-a};a+=s.b}return null}
const secStart=i=>S.secs.slice(0,i).reduce((a,s)=>a+s.b,0);
function chord(s){const m=(s||'').match(/^([A-G])([#b]?)(.*)$/);if(!m)return null;let r=({C:0,D:2,E:4,F:5,G:7,A:9,B:11})[m[1]];if(m[2]=='#')r++;if(m[2]=='b')r--;r=(r+12)%12;const q=m[3];let iv=[0,4,7];if(/^m(?!aj)/.test(q))iv=[0,3,7];if(q.startsWith('dim'))iv=[0,3,6];if(q.includes('sus2'))iv=[0,2,7];if(q.includes('sus4'))iv=[0,5,7];if(/7/.test(q))iv=iv.concat(/maj7/.test(q)?11:10);return{r,iv}}
const hz=m=>(S.tune||440)*Math.pow(2,(m-69)/12);
const SC={'':[0,2,4,5,7,9,11],m:[0,2,3,5,7,8,10]};
function diat(){const q=S.mode?['m','dim','','m','m','','']:['','m','m','','','m','dim'];return SC[S.mode].map((s,i)=>KEYS[(S.key+s)%12]+q[i])}
/* ---------- AUDIO ---------- */
let V=null;
function audio(){if(V)return;const n=(t,d,f,fq)=>{const x=new Tone.NoiseSynth({noise:{type:t},envelope:{attack:.001,decay:d,sustain:0}});const fl=new Tone.Filter(fq,f).toDestination();x.connect(fl);return x};
const mem=(o,e)=>new Tone.MembraneSynth({pitchDecay:o[0],octaves:o[1],envelope:{attack:.001,decay:e,sustain:0,release:.05}}).toDestination();
const poly=(c,o)=>new Tone.PolySynth(c,o).toDestination();
V={kick:mem([.05,6],.35),snare:n('white',.16,'highpass',1200),rim:mem([.005,2],.05),hat:n('white',.04,'highpass',7500),ohat:n('white',.28,'highpass',7000),shaker:n('pink',.07,'bandpass',5000),conga:mem([.02,3],.16),tom:mem([.04,4],.3),
bass:new Tone.MonoSynth({oscillator:{type:'sawtooth'},filter:{Q:2,type:'lowpass',rolloff:-24},envelope:{attack:.01,decay:.2,sustain:.5,release:.1},filterEnvelope:{attack:.01,decay:.2,sustain:.3,baseFrequency:120,octaves:2.5}}).toDestination(),
guitar:poly(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:.001,decay:.12,sustain:0,release:.05}}),
organ:poly(Tone.Synth,{oscillator:{type:'square'},envelope:{attack:.005,decay:.1,sustain:.5,release:.06}}),
rhodes:poly(Tone.FMSynth,{harmonicity:3.01,modulationIndex:1.5,envelope:{attack:.01,decay:1,sustain:.2,release:1},modulationEnvelope:{attack:.01,decay:.5,sustain:0,release:.5}}),
lead:new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.01,decay:.2,sustain:.4,release:.2}}).toDestination(),
click:new Tone.MembraneSynth({envelope:{attack:.001,decay:.03,sustain:0}}).toDestination()};
V.kick.volume.value=-2;V.snare.volume.value=-10;V.rim.volume.value=-12;V.hat.volume.value=-18;V.ohat.volume.value=-18;V.shaker.volume.value=-16;V.conga.volume.value=-8;V.tom.volume.value=-8;V.bass.volume.value=-8;V.guitar.volume.value=-14;V.organ.volume.value=-20;V.rhodes.volume.value=-14;V.lead.volume.value=-10;V.click.volume.value=-14;V.snare.connect&&0;
Tone.Transport.scheduleRepeat(tick,'16n')}
const NT={kick:['C1','8n'],rim:['E5','32n'],conga:['A3','16n'],tom:['D2','8n']};
function hit(k,t,v=1){if(SMP[k]){SMP[k].start(t);return}const x=V[k];if(NT[k])x.triggerAttackRelease(NT[k][0],NT[k][1],t,v);else x.triggerAttackRelease('16n',t,v)}
function tick(time){const spb=SPB();if(P.loop){const a=secStart(S.sel)*spb,b=a+S.secs[S.sel].b*spb;if(P.step<a||P.step>=b)P.step=a}
if(P.step>=total()*spb)P.step=0;const st=P.step,bar=st/spb|0,si=st%spb,k=si%16,o=info(bar),ok=t=>!S.mute[t]&&(!P.solo||P.solo==t);
if(P.met&&si%4==0)V.click.triggerAttackRelease(si==0?'C5':'G4','32n',time);
const p=o.s.p,c=chord(o.s.ch[o.l]);
if(ok('drums')){const d=pat('drums',p.drums);DR.forEach(([r])=>{if(d[r][k])hit(r,time,r=='kick'?1:.8)})}
if(c){const b=pat('bass',p.bass)[k];if(ok('bass')&&b){const m={1:0,2:7,3:12,4:c.iv[1]}[b];(SMP.bass||V.bass).triggerAttackRelease(hz(24+c.r+(c.r>6?0:12)+m),'8n',time)}
const ch=(t,base,dur)=>{if(ok(t)&&pat(t,p[t])[k])(SMP[t]||V[S.snd[t]=='rhodes'?'rhodes':t=='skank'?'guitar':'organ']).triggerAttackRelease(c.iv.map(i=>hz(base+c.r+i)),dur,time)};ch('skank',48,'16n');ch('organ',60,'16n')}
const m=pat('melody',p.melody)[k];if(ok('melody')&&m){const s=scl(),d=m-1,n=s.length;(SMP.melody||V[S.snd.melody=='rhodes'?'rhodes':S.snd.melody=='organ'?'organ':'lead']).triggerAttackRelease(hz(60+S.key+s[d%n]+12*Math.floor(d/n)),'8n',time)}
P.step++;Tone.Draw.schedule(()=>cursor(st),time)}
function cursor(st){const spb=SPB(),pos=st/spb,c=$('#cur');if(c){const x=110+pos*W,sc=$('#sc');c.style.left=x+'px';if(P.playing&&sc&&(x<sc.scrollLeft+130||x>sc.scrollLeft+sc.clientWidth-60))sc.scrollLeft=x-200}
document.querySelectorAll('.st.ph').forEach(e=>e.classList.remove('ph'));document.querySelectorAll('.st[data-i="'+(st%spb%16)+'"]').forEach(e=>e.classList.add('ph'));
const o=info(Math.min(total()-1,pos|0));$('#pos').textContent='Compás '+((pos|0)+1)+(o?' · '+o.s.n:'')}
async function play(){await Tone.start();audio();Tone.Transport.bpm.value=S.bpm;Tone.Transport.start();P.playing=true;$('#bPlay').textContent='❚❚'}
function togglePlay(){if(P.playing){Tone.Transport.pause();P.playing=false;$('#bPlay').textContent='▶'}else{P.solo=null;play()}}
function stopAll(){if(V){Tone.Transport.stop()}P.playing=false;P.solo=null;P.step=0;$('#bPlay').textContent='▶';cursor(0)}
function toggleLoop(){P.loop=!P.loop;$('#bLoop').classList.toggle('on',P.loop)}
function toggleMet(){P.met=!P.met;$('#bMet').classList.toggle('on',P.met)}
function seek(b){P.step=b*SPB();cursor(P.step)}
function preview(t){P.solo=t;P.loop=true;$('#bLoop').classList.add('on');P.step=secStart(S.sel)*SPB();play()}
function setBpm(){S.bpm=Math.max(50,Math.min(220,+$('#bpm').value||120));if(V)Tone.Transport.bpm.value=S.bpm;head()}
function setKey(){S.key=+$('#key').value;S.mode=$('#mode').value;head();render()}
function setTs(){S.ts=$('#ts').value;if(V)Tone.Transport.timeSignature=S.ts=='6/8'?[6,8]:+S.ts[0];P.step=0;head();render()}
function head(){$('#meta').textContent=S.name+' · '+S.bpm+' BPM · '+kn()+' · '+S.ts}
/* ---------- VIEWS ---------- */
const NAV=[['vis','Song Visualizer'],['drums','Drum Studio'],['bass','Bass Studio'],['inst','Instrument Studio'],['mel','Melody & Hook'],['lib','Sound Library']];
function render(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
$('#dl').innerHTML=diat().map(c=>`<option value="${c}">`).join('');
$('#main').innerHTML=({vis:vVis,drums:vDrums,bass:vBass,inst:vInst,mel:vMel,lib:vLib})[view]();cursor(P.step)}
const go=v=>{view=v;render()};
const cell=(on,i,fn,col)=>`<div class="st${on?' on':''}${i%4==0?' q':''}" data-i="${i}" style="--c:var(${col})" onclick="${fn}"></div>`;
const grow=(l,h)=>`<div class="gr"><span class="gl">${l}</span>${h}</div>`;
function secChips(){return `<div class="chips">${S.secs.map((s,i)=>`<button class="${i==S.sel?'on':''}" onclick="S.sel=${i};render()">${s.n}</button>`).join('')}</div>`}
function varBar(t){const v=S.secs[S.sel].p[t];return `<div class="card"><b>Sección:</b>${secChips()}<div class="chips"><b style="align-self:center">Variación</b>${'ABCD'.split('').map(x=>`<button class="${v==x?'on':''}" onclick="setVar('${t}','${x}')">${x}</button>`).join('')}<span class="sp"></span><button onclick="allVar('${t}')">Aplicar a todas las secciones</button><button onclick="preview('${t}')">▶ Preescuchar sección</button></div><span class="meta">Editas la variación ${v} de «${S.secs[S.sel].n}». Los cambios se escuchan al instante.</span></div>`}
const setVar=(t,x)=>{S.secs[S.sel].p[t]=x;render()},allVar=t=>{const x=S.secs[S.sel].p[t];S.secs.forEach(s=>s.p[t]=x);render()};
function vVis(){const tot=total(),spb=SPB();let ruler='',secs='',chs='',lanes='';
for(let b=0;b<tot;b++){const o=info(b),f=o.l==0?' s0':'';ruler+=`<div class="c${f}" onclick="seek(${b})">${b+1}</div>`;chs+=`<input class="ch${f}" value="${o.s.ch[o.l]}" list="dl" onchange="setCh(${o.i},${o.l},this.value)" aria-label="Acorde compás ${b+1}">`}
secs=S.secs.map((s,i)=>`<div class="secb${i==S.sel?' sel':''}" style="width:${s.b*W}px;background:${s.c}" onclick="S.sel=${i};render()">${s.n} · ${s.b}</div>`).join('');
for(const [t,n,col] of T){let cs='';for(let b=0;b<tot;b++){const o=info(b),p=pat(t,o.s.p[t]);let d='';for(let k=0;k<16;k++){let on=t=='drums'?DR.some(([r])=>p[r][k]):p[k],h=t=='bass'?{1:10,2:40,3:80,4:25}[p[k]]:t=='melody'?p[k]*10:50;if(on)d+=`<i style="left:${k*100/16}%;bottom:${t=='drums'||t=='skank'||t=='organ'?'35%':h+'%'}"></i>`}
cs+=`<div class="c b${o.l==0?' s0':''}" style="--k:var(${col})">${d}</div>`}

function vDrums(){const p=cur('drums'),gs=[...new Set(PRE.map(x=>x[0]))];return `<h2>Drum Studio</h2><p class="sub">Groove Presets editables (datos rítmicos, no audio): escucha, usa en una sección o en toda la canción y modifica los golpes.</p><div class="card"><b>Groove Presets</b><div class="chips"><button class="${PG?'':'on'}" onclick="PG='';render()">Todos</button>${gs.map(g=>`<button class="${PG==g?'on':''}" onclick="PG='${g}';render()">${g}</button>`).join('')}</div>${PRE.map((x,i)=>PG&&x[0]!=PG?'':`<div class="item"><b>${x[1]}</b><span class="tag">${x[0]}</span><span class="meta">${x[2]} BPM · ${x[3]} · A B C D + fill</span><span class="sp"></span><button onclick="prePv(${i})">▶ Escuchar</button><button onclick="applyPre(${i},0)">Usar en sección</button><button onclick="applyPre(${i},1)">Toda la canción</button></div>`).join('')}</div>${varBar('drums')}<div class="card pad">${DR.map(([r,n])=>grow(n+(SMP[r]?' ◉':''),p[r].map((x,i)=>cell(x,i,`tgD('${r}',${i})`,'--vi')).join(''))).join('')}<div class="chips"><button onclick="clr('drums')">Limpiar variación</button><button onclick="fill()">Fill aleatorio</button></div></div>`}
function vMel(){const s=scl(),n=s.length,rows=[8,7,6,5,4,3,2,1].map(d=>[nn(d-1)+(d>n?'↑':''),d]),iv=s.map((x,i)=>{const d=(s[(i+1)%n]-x+12)%12;return d==1?'S':d==2?'T':d==3?'T+S':d+'st'});return `<h2>Melody & Hook Lab</h2><p class="sub">Elige escala o modo: se reproducen exactamente las notas mostradas (T tono · S semitono).</p>${varBar('melody')}<div class="card"><div class="chips" style="align-items:center"><select onchange="S.scale=this.value;render()" aria-label="Escala">${Object.keys(SCL).map(k=>`<option${S.scale==k?' selected':''}>${k}</option>`).join('')}</select><b>${s.map((x,i)=>nn(i)).join(' · ')}</b></div><div class="meta">Intervalos: ${iv.join(' · ')}</div></div><div class="card pad">${roll('melody',rows,'--gr')}<div class="chips"><button onclick="gen('up')">↗ Ascendente</button><button onclick="gen('down')">↘ Descendente</button><button onclick="gen('wave')">∿ Ondulado</button><button onclick="gen('leap')">Saltos</button><button onclick="gen('hook')">Hook sobre los acordes</button><button onclick="clr('melody')">Limpiar</button><select onchange="S.snd.melody=this.value" aria-label="Sonido">${[['lead','Lead'],['rhodes','Rhodes'],['organ','Órgano']].map(([v,l])=>`<option value="${v}"${S.snd.melody==v?' selected':''}>${l}</option>`).join('')}</select></div></div>`}
function gen(k){const p=cur('melody'),pos=[0,2,4,6,8,10,12,14];p.fill(0);if(k=='up')pos.forEach((x,i)=>p[x]=i+1);if(k=='down')pos.forEach((x,i)=>p[x]=8-i);if(k=='wave')pos.forEach((x,i)=>p[x]=[1,3,2,4,3,5,4,2][i]);if(k=='leap')pos.forEach((x,i)=>p[x]=[1,5,3,8,5,2,6,1][i]);
if(k=='hook'){const s=scl(),c=chord(S.secs[S.sel].ch[0]),ok=[1,2,3,4,5,6,7,8].filter(d=>c&&c.iv.includes(((S.key+s[(d-1)%s.length])-c.r+12)%12));const pk=ok.length?ok:[1];let d=pk[0];[0,3,5,8,11,13].forEach(x=>{d=(x==0||x==8)?pk[Math.random()*pk.length|0]:Math.max(1,Math.min(8,d+[-2,-1,0,1,2][Math.random()*5|0]));p[x]=d})}render()}
function useS(v,it){try{if(DR.some(d=>d[0]==v))SMP[v]=it.p;else SMP[v]=new Tone.Sampler({urls:{[it.root||'C3']:it.p.buffer},release:.3}).toDestination()}catch(e){alert('Nota original no válida (ej. C3)')}}
function asS(i){const v=$('#as'+i).value;S.assign[v]=LIB[i].n;useS(v,LIB[i]);render()}
function qa(t,i){if(i===''){delete SMP[t];delete S.assign[t]}else{S.assign[t]=LIB[i].n;useS(t,LIB[i])}render()}
function addBank(){const n=$('#nb').value.trim();if(!n)return;S.banks[n]=S.banks[n]||[];CB=n;render()}
async function imp(fs){await Tone.start();audio();const cat=$('#icat').value;for(const f of fs){const it={n:f.name,d:0,bank:CB,cat,root:'C3'};if(!S.banks[CB].includes(f.name))S.banks[CB].push(f.name);it.p=new Tone.Player(URL.createObjectURL(f),()=>{it.d=it.p.buffer.duration;Object.entries(S.assign).forEach(([v,n])=>{if(n==f.name)useS(v,it)});if(view=='lib')render()}).toDestination();LIB.push(it)}render()}
function vLib(){const tg=[...DR.map(d=>d[0]),'bass','skank','organ','melody'],bk=Object.keys(S.banks);return `<h2>Sound Library</h2><p class="sub">Importa WAV/MP3, organízalos en bancos y asígnalos como fuente real de cada instrumento. Cambiar el sonido no altera patrones ni notas.</p><div class="two"><div class="card"><b>Sonidos de Groove Lab</b>${BUILT.map((b,i)=>{const[tr,o]=b[2].split(':'),act=o&&S.snd[tr]==o;return `<div class="item"><button class="rb" style="width:34px;height:34px;font-size:12px" onclick="pv(${i})" aria-label="Preescuchar ${b[0]}">▶</button><span>${b[0]}</span><span class="tag">${b[1]}</span><span class="sp"></span>${o?`<button class="${act?'on':''}" onclick="asg(${i})">${act?'Asignado':'Asignar'}</button>`:''}</div>`}).join('')}</div>
<div class="card"><b>Mis bancos y muestras</b><div class="chips"><select onchange="CB=this.value;render()" aria-label="Banco">${bk.map(b=>`<option${b==CB?' selected':''}>${b}</option>`).join('')}</select><input type="text" id="nb" placeholder="Nuevo banco" style="width:120px"><button onclick="addBank()">Crear banco</button></div><div class="chips"><select id="icat"><option>Drums</option><option>Bajo</option><option>Guitarra</option><option>Órgano</option><option>Melodía</option></select><input type="file" accept=".wav,.mp3,audio/*" multiple onchange="imp(this.files)"></div>
${bk.map(b=>`<b>${b}</b> <span class="tag">${S.banks[b].length} muestras</span>${LIB.map((l,i)=>l.bank!=b?'':`<div class="item"><button class="rb" style="width:34px;height:34px;font-size:12px" onclick="LIB[${i}].p.start()" aria-label="Preescuchar">▶</button><span>${l.n}</span><span class="tag">${l.cat}</span><span class="tag">${l.d?l.d.toFixed(2)+' s':'…'}</span><input type="text" value="${l.root}" style="width:48px" title="Nota original (para instrumentos melódicos)" onchange="LIB[${i}].root=this.value"><select id="as${i}">${tg.map(t=>`<option>${t}</option>`).join('')}</select><button onclick="asS(${i})">Asignar</button></div>`).join('')}`).join('')}
<div class="chips">${Object.entries(S.assign).map(([v,n])=>`<button onclick="qa('${v}','')">${v}: ${n} ✕</button>`).join('')||'<span class="meta">Sin asignaciones. Las asignaciones se guardan en el proyecto; al reabrirlo, vuelve a importar el archivo con el mismo nombre y se reasigna solo.</span>'}</div></div></div>`}
const src=t=>`<div class="card"><b>Fuente de sonido (${t}):</b> ${S.assign[t]||S.snd[t]} <select onchange="qa('${t}',this.value)" aria-label="Muestra"><option value="">Sonido integrado</option>${LIB.map((l,i)=>`<option value="${i}">${l.n}</option>`).join('')}</select> <button onclick="go('lib')">Sound Library</button></div>`;
NAV.push(['guit','Guitar Chords'],['tuner','Chromatic Tuner']);
const SH={maj:[[0,2,2,1,0,0],[-1,0,2,2,2,0]],min:[[0,2,2,0,0,0],[-1,0,2,2,1,0]],'7':[[0,2,0,1,0,0],[-1,0,2,0,2,0]],maj7:[[0,2,1,1,0,0],[-1,0,2,1,2,0]],m7:[[0,2,0,0,0,0],[-1,0,2,0,1,0]],sus2:[[0,2,4,4,0,0],[-1,0,2,2,0,0]],sus4:[[0,2,2,2,0,0],[-1,0,2,2,3,0]],dim:[[0,1,2,0,-1,-1],[-1,0,1,2,1,-1]],aug:[[0,3,2,1,1,0],[-1,0,3,2,2,1]]},IVS={maj:[0,4,7],min:[0,3,7],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],sus2:[0,2,7],sus4:[0,5,7],dim:[0,3,6],aug:[0,4,8]},SUF={maj:'',min:'m'},OPEN=[40,45,50,55,59,64];
const qual=q=>q.includes('sus2')?'sus2':q.includes('sus4')?'sus4':q.startsWith('dim')?'dim':/^(aug|\+)/.test(q)?'aug':/maj7/.test(q)?'maj7':/^m7/.test(q)?'m7':/^m(?!aj)/.test(q)?'min':/7/.test(q)?'7':'maj';
function gparse(){const m=GC.match(/^([A-G][#b]?)(.*)$/),c=chord(GC);return c?{r:c.r,q:qual(m[2])}:{r:0,q:'maj'}}
function gpos(){const{r,q}=gparse(),o=[];SH[q].forEach((sh,fi)=>{const f=((r-(fi?9:4))%12+12)%12;[f,f+12].forEach(ff=>{if(ff==f||f<=2)o.push({fr:sh.map(x=>x<0?-1:x+ff),f:ff})})});return o.sort((a,b)=>a.f-b.f)}
function fing(p){const o=p.fr.map((n,i)=>[n,i]).filter(x=>x[0]>0).sort((a,b)=>a[0]-b[0]||a[1]-b[1]),m={};let k=1;if(p.f>0){o.filter(x=>x[0]==p.f).forEach(x=>m[x[1]]=1);k=2}o.forEach(x=>{if(!m[x[1]])m[x[1]]=Math.min(k++,4)});return m}
function gSvg(p){const base=p.f>0?p.f:1,X=i=>30+i*26,Y=j=>46+j*30,fg=fing(p);let s=`<svg viewBox="0 0 200 215" width="260" role="img" aria-label="Diagrama de acorde"><g stroke="var(--mu)" fill="none">`;for(let j=0;j<=5;j++)s+=`<line x1="${X(0)}" x2="${X(5)}" y1="${Y(j)}" y2="${Y(j)}" stroke-width="${j==0&&base==1?4:1}"/>`;for(let i=0;i<6;i++)s+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(0)}" y2="${Y(5)}"/>`;s+='</g>';if(base>1)s+=`<text x="0" y="${Y(0)+20}" fill="var(--tx)" font-size="12">${base}</text>`;
const bs=p.fr.map((n,i)=>n==p.f&&p.f>0?i:-1).filter(i=>i>=0);if(bs.length>1)s+=`<rect x="${X(bs[0])-10}" y="${Y(0)+5}" width="${X(bs[bs.length-1])-X(bs[0])+20}" height="20" rx="10" fill="var(--ac)" opacity=".45"/>`;
p.fr.forEach((n,i)=>{if(n<0)s+=`<text x="${X(i)}" y="36" text-anchor="middle" fill="var(--rd)" font-size="15">×</text>`;else if(n==0)s+=`<circle cx="${X(i)}" cy="31" r="6" fill="none" stroke="var(--gr)" stroke-width="2"/>`;else s+=`<circle cx="${X(i)}" cy="${Y(n-base)+15}" r="10" fill="var(--ac)"/><text x="${X(i)}" y="${Y(n-base)+20}" text-anchor="middle" fill="#fff" font-size="13">${fg[i]}</text>`});return s+'</svg>'}
function setG(){GC=KEYS[+$('#gr').value]+({maj:'',min:'m'}[$('#gq').value]??$('#gq').value);GP=0;render()}
function vGuit(){const{r,q}=gparse(),ps=gpos(),p=ps[Math.min(GP,ps.length-1)],low=p.fr.findIndex(x=>x>=0),rel=((OPEN[low]+p.fr[low])%12-r+12)%12,inv=rel==0?'Estado fundamental':[3,4].includes(rel)?'1ª inversión':[6,7,8].includes(rel)?'2ª inversión':'3ª inversión / extensión',us=[...new Set(S.secs[S.sel].ch)];return `<h2>Guitar Chord Visualizer</h2><p class="sub">Acorde del Song Visualizer (doble clic en un acorde) o elige uno aquí.</p><div class="card"><div class="chips" style="align-items:center"><select id="gr" onchange="setG()">${KEYS.map((k,i)=>`<option value="${i}"${i==r?' selected':''}>${k}</option>`).join('')}</select><select id="gq" onchange="setG()">${Object.keys(SH).map(k=>`<option${k==q?' selected':''}>${k}</option>`).join('')}</select><b style="font-size:20px">${GC}</b><button onclick="gPlay()">▶ Escuchar</button></div><div class="chips"><span class="meta">Sección «${S.secs[S.sel].n}»:</span>${us.map(c=>`<button class="${c==GC?'on':''}" onclick="GC='${c}';GP=0;render()">${c}</button>`).join('')}</div></div><div class="card"><div class="chips">${ps.map((x,i)=>`<button class="${x==p?'on':''}" onclick="GP=${i};render()">Posición ${i+1} · traste ${x.f||'abierto'}</button>`).join('')}</div><div class="two"><div>${gSvg(p)}</div><div><p><b>Notas:</b> ${IVS[q].map(i=>KEYS[(r+i)%12]).join(' · ')}</p><p><b>${inv}</b></p><p class="meta">Los números son la digitación recomendada. × = no tocar · ○ = al aire.</p></div></div></div>`}
async function gPlay(){await Tone.start();audio();const p=gpos()[GP]||gpos()[0],t=Tone.now()+.05;p.fr.forEach((n,i)=>{if(n>=0)V.guitar.triggerAttackRelease(hz(OPEN[i]+n),'2n',t+i*.03)})}
document.addEventListener('dblclick',e=>{if(e.target.classList&&e.target.classList.contains('ch')&&e.target.value){GC=e.target.value;GP=0;go('guit')}});
function pitch(b,sr){let r=0;for(const x of b)r+=x*x;if(Math.sqrt(r/b.length)<.008)return -1;const mn=Math.floor(sr/1200),mx=Math.floor(sr/50),c=[];let M=0;for(let o=mn-1;o<=mx+1;o++){let s=0;for(let i=0;i<2048;i++)s+=b[i]*b[i+o];c[o]=s;if(o>=mn&&s>M)M=s}for(let o=mn;o<=mx;o++)if(c[o]>.9*M&&c[o]>=c[o-1]&&c[o]>=c[o+1]){const d=c[o-1]-2*c[o]+c[o+1];return sr/(o+(d?(c[o-1]-c[o+1])/(2*d):0))}return -1}
function vTuner(){return `<h2>Chromatic Tuner</h2><p class="sub">Detecta la nota con el micrófono. Referencia A4 = <input type="number" value="${S.tune}" style="width:70px" onchange="S.tune=+this.value||440;$('#tune').value=S.tune"> Hz</p><div class="card" style="text-align:center"><div id="tnote" style="font-size:64px;font-weight:700">—</div><div id="tstat" class="meta">Pulsa iniciar y toca una nota</div><div style="position:relative;height:30px;margin:14px auto;max-width:420px;background:var(--cell);border-radius:15px"><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gr)"></div><div id="tneedle" style="position:absolute;top:2px;bottom:2px;width:10px;border-radius:5px;background:var(--or);left:50%;margin-left:-5px"></div></div><div id="tcents">0 cents</div><p><button class="on" onclick="tuner()">${TN?'Detener':'Iniciar micrófono'}</button></p></div>`}
async function tuner(){if(TN){TN.s.getTracks().forEach(t=>t.stop());TN=null;render();return}try{await Tone.start();const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}}),cx=Tone.context.rawContext,an=cx.createAnalyser();an.fftSize=4096;cx.createMediaStreamSource(s).connect(an);TN={s};const b=new Float32Array(4096);(function lp(){if(!TN)return;an.getFloatTimeDomainData(b);const f=pitch(b,cx.sampleRate);if($('#tnote')&&f>0){const m=69+12*Math.log2(f/S.tune),r=Math.round(m),c=(m-r)*100;$('#tnote').textContent=KEYS[(r%12+12)%12]+(Math.floor(r/12)-1);$('#tcents').textContent=(c>0?'+':'')+c.toFixed(0)+' cents · '+f.toFixed(1)+' Hz';$('#tstat').textContent=Math.abs(c)<5?'Afinada':c<0?'Baja':'Alta';$('#tneedle').style.left=(50+Math.max(-50,Math.min(50,c))*.9)+'%'}requestAnimationFrame(lp)})();render()}catch(e){alert('No se pudo acceder al micrófono: '+e.message)}}
function render(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');$('#dl').innerHTML=diat().map(c=>`<option value="${c}">`).join('');let h=({vis:vVis,drums:vDrums,bass:vBass,inst:vInst,mel:vMel,lib:vLib,guit:vGuit,tuner:vTuner})[view]();if(view=='vis')h+='<p class="sub">Doble clic en un acorde para abrir su diagrama de guitarra.</p>';if(view=='bass')h+=src('bass');if(view=='inst')h+=src('skank')+src('organ');if(view=='mel')h+=src('melody');$('#main').innerHTML=h;cursor(P.step)}
function fixS(){S.tune=S.tune||440;S.assign=S.assign||{};S.banks=S.banks||{'Mis sonidos':[]};S.genre=S.genre||'REGGAE Y DERIVADOS';S.sub=S.sub||'One Drop';S.scale=S.scale||(S.mode?'Menor natural (eólico)':'Mayor (jónico)');if(!S.banks[CB])CB=Object.keys(S.banks)[0]}
function fillSub(){$('#sub').innerHTML=(GEN[S.genre]||[]).map(g=>`<option${g==S.sub?' selected':''}>${g}</option>`).join('')}
function sync(){fixS();$('#bpm').value=S.bpm;$('#key').value=S.key;$('#mode').value=S.mode;$('#ts').value=S.ts;$('#tune').value=S.tune;$('#gen').innerHTML=Object.keys(GEN).map(g=>`<option${g==S.genre?' selected':''}>${g}</option>`).join('');fillSub();head()}
function setGen(){S.genre=$('#gen').value;S.sub=GEN[S.genre][0];fillSub();setSub()}
function setSub(){S.sub=$('#sub').value;const i=PRE.findIndex(p=>p[1]==S.sub);if(i>=0)applyPre(i,1);else head()}
function setKey(){S.key=+$('#key').value;S.mode=$('#mode').value;if(/Mayor \(|natural \(e/.test(S.scale))S.scale=S.mode?'Menor natural (eólico)':'Mayor (jónico)';head();render()}
$('#key').innerHTML=KEYS.map((k,i)=>`<option value="${i}">${k}</option>`).join('');
sync();list();render();
</script></body></html>
