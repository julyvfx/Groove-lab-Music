const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('groovelab',1);r.onupgradeneeded=()=>r.result.createObjectStore('smp');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idb(m,k,v){try{const d=await DB();return await new Promise((res,rej)=>{const o=d.transaction('smp',m=='get'?'readonly':'readwrite').objectStore('smp'),q=m=='get'?o.get(k):o.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
function mkSmp(it,out){const play=(t,rate,len,g)=>{const c=Tone.context.rawContext,s=c.createBufferSource(),e=c.createGain();s.buffer=it.buf;s.playbackRate.value=rate;t=Math.max(t||0,c.currentTime);const end=t+Math.min(len,it.buf.duration/rate,6);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.004);e.gain.setValueAtTime(g,Math.max(t+.005,end-.08));e.gain.linearRampToValueAtTime(0,end);s.connect(e);Tone.connect(e,out||Tone.Destination);s.start(t);s.stop(end+.02)};
return{buffer:it.buf,start(t){play(t,1,it.cat=='Drums'?2:3,.9)},triggerAttackRelease(n,d,t){const a=Array.isArray(n)?n:[n],dur=Tone.Time(d).toSeconds()+.12;a.forEach(f=>{const m=69+12*Math.log2(f/(S.tune||440));play(t,Math.min(4,Math.max(.25,Math.pow(2,(m-r2m(it.root))/12))),dur,.8/Math.sqrt(a.length))})}}}
async function addSmp(n,ab,cat,bank,root){const ex=LIB.find(l=>l.n==n);if(ex)return ex;const buf=await Tone.context.rawContext.decodeAudioData(ab.slice(0)),it={n,d:buf.duration,buf,bank:bank||CB,cat:cat||'Drums',root:root||'C3',ab};if(!root&&it.cat!='Drums'){const ch=buf.getChannelData(0);if(ch.length>=4096){const o=Math.max(0,Math.min(ch.length-4096,(ch.length>>1)-2048)),fr=pitch(ch.slice(o,o+4096),buf.sampleRate);if(fr>0){const m=Math.round(69+12*Math.log2(fr/(S.tune||440)));it.root=KEYS[(m%12+12)%12]+(Math.floor(m/12)-1)}}}it.p=mkSmp(it);LIB.push(it);return it}
async function restoreSamples(){const names=new Set([...Object.values(S.assign||{}),...Object.values(S.banks||{}).flat(),...S.inst.map(i=>i.smp).filter(Boolean)]);for(const n of names){if(LIB.find(l=>l.n==n))continue;const r=await idb('get',n);if(r)try{await addSmp(n,r.ab,r.cat,r.bank,r.root)}catch(e){}}}

/* ---- eventos: ties, sostenidos, reproducción ---- */
function evsOf(tr,bar){const o=info(bar);if(!o)return[];const pt=pat(tr,o.s.p[tr]);return pt&&pt.ev?pt.ev:[]}
const segGet=b=>{const o=info(b);return o?segsOf(o.s,o.l):[]};
function tiedP(get,bar,e,same){if(!e.tie)return false;if(get(bar).some(x=>x!==e&&same(x)&&x.s+x.d==e.s))return true;return bar>0&&get(bar-1).some(x=>same(x)&&x.s+x.d-BT()==e.s)}
function chain(get,bar,e,same){let tot=e.d,end=e.s+e.d,b=bar;for(let g=0;g<16;g++){while(end>=BT()){end-=BT();b++}if(b>=total())break;const nx=get(b).find(x=>x.tie&&x.s==end&&same(x));if(!nx)break;tot+=nx.d;end=nx.s+nx.d}return tot}
function voiceSyn(){return V.voice||(V.voice=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:.03,decay:.1,sustain:.8,release:.15}}).connect(MIX.voice))}
const vMidi=n=>{const s=scl(),k=n-1;return 60+S.key+(S.trk&&+S.trk.voice||0)+s[k%s.length]+12*Math.floor(k/s.length)};
function evStep(bar,si,time,ok,o){const t0=si*12,tk=60/S.bpm/48;
const fire=(tr,fn)=>{if(!ok(tr))return;const get=b=>evsOf(tr,b);for(const e of get(bar)){if(e.rest||e.s<t0||e.s>=t0+12)continue;const same=x=>!x.rest&&x.n==e.n;if(tiedP(get,bar,e,same))continue;fn(e,time+(e.s-t0)*tk,Math.max(.04,chain(get,bar,e,same)*tk*.96))}};
fire('bass',(e,t,d)=>{const c=chordAt(bar,e.s);if(c)(SMP.bass||V.bass).triggerAttackRelease(hz(bassNote(e.n,c)),d,t)});
fire('voice',(e,t,d)=>voiceSyn().triggerAttackRelease(hz(vMidi(e.n)),d,t));
S.inst.forEach(i=>fire('i_'+i.id,(e,t,d)=>{const c=chordAt(bar,e.s);if(c)instHit(i,c,t,d)}));
if(ok('chords')&&S.pad!==false){const g=segsOf(o.s,o.l);for(const sg of g){if(sg.s<t0||sg.s>=t0+12)continue;const same=x=>x.c==sg.c;if(tiedP(segGet,bar,sg,same))continue;const c=chordAt(bar,sg.s);if(!c)continue;V.rhodes.triggerAttackRelease(cn(c,48).map(hz),Math.max(.05,chain(segGet,bar,sg,same)*tk*(sg.art=='stac'?.4:.97)),time+(sg.s-t0)*tk,(sg.v??.8)*.5)}}}
function instHit(i,c,time,dur){const cf=ICAT[i.cat]||ICAT.Piano,a=IA[i.id]||mkInst(i);a.ch.volume.value=i.vol;a.ch.pan.value=i.pan;const it=i.smp&&LIB.find(l=>l.n==i.smp),d=dur||Tone.Time(cf.d||'8n').toSeconds(),tr=+i.tr||0,notes=cf.k=='p'?cn(c,cf.b+tr).map(hz):hz(24+c.r+(c.r>6?0:12)+tr);if(it){const sm=a.sm[it.n]||(a.sm[it.n]=mkSmp(it,a.ch));cf.k=='m'||cf.k=='n'?sm.start(time):sm.triggerAttackRelease(notes,d,time)}else if(cf.k=='m')a.s.triggerAttackRelease(cf.n,'16n',time);else if(cf.k=='n')a.s.triggerAttackRelease('4n',time);else a.s.triggerAttackRelease(notes,d,time)}

/* ---- conversión entre cuadrícula de 16 pasos y eventos ---- */
function arr2ev(tr,a){const o=[];for(let i=0;i<16;i++){const x=a[i];if(!x||x==99)continue;let l=1;while(i+l<16&&a[i+l]==99)l++;o.push({s:i*12,d:(tr=='bass'?Math.max(2,l):2)*12,n:tr=='bass'?x:1})}return o}
function ev2arr(pt){if(Array.isArray(pt))return pt;const a=Array(16).fill(0);(pt.ev||[]).forEach(e=>{if(e.rest||e.tie)return;const k=Math.min(15,Math.floor(e.s*16/BT()));a[k]=a[k]||e.n});return a}
function lane(t,p){if(p&&p.ev){const a=Array(16).fill(0);p.ev.forEach(e=>{if(!e.rest)a[Math.min(15,Math.floor(e.s*16/BT()))]=e.n||1});return a}return p}
function legT(t){const k=S.secs[S.sel].p[t]||'A',p=S.pats[t]&&S.pats[t][k];if(p&&!Array.isArray(p))S.pats[t][k]=ev2arr(p)}
const legB=()=>legT('bass');
function evView(tr){const p=pat(tr,S.secs[S.sel].p[tr]);return Array.isArray(p)?arr2ev(tr,p):(p.ev||[])}
function evW(tr){const s=S.secs[S.sel],v=s.p[tr]||(s.p[tr]='A');let p=S.pats[tr][v];if(!p||Array.isArray(p))p=S.pats[tr][v]={ev:arr2ev(tr,p||[])};return p.ev}
function evClean(L,e){for(let i=L.length-1;i>=0;i--){const x=L[i];if(x===e)continue;if(x.s>=e.s&&x.s<e.s+e.d)L.splice(i,1);else if(x.s<e.s&&x.s+x.d>e.s)x.d=e.s-x.s}}
function evIns(tr,n,s,d,rest){const L=evW(tr),e={s,d,n:rest?0:n};if(rest)e.rest=1;L.push(e);evClean(L,e);L.sort((a,b)=>a.s-b.s);return e}
function tryTie(L,e){const p=L.find(x=>x!==e&&!x.rest&&!e.rest&&x.n==e.n&&x.s+x.d==e.s)||(e.s==0&&L.find(x=>x!==e&&!x.rest&&x.n==e.n&&x.s+x.d==BT()));if(p)e.tie=1;else toast('Ligadura: necesita una nota contigua de la misma altura justo antes (o al final del compás si la nota ligada empieza en el tiempo 1).')}
function evOp(op){const s=EV.sel;if(!s)return;const L=evW(s.tr),e=L[s.i];if(!e)return;const sn=snapOf(),rows=EDK[kindOf(s.tr)]().rows;
if(op=='del'){L.splice(s.i,1);EV.sel=null}else if(op=='fig'){e.d=durOf();evClean(L,e)}else if(op=='tie'){if(e.tie)delete e.tie;else tryTie(L,e)}else if(op=='l'||op=='r'){e.s=Math.max(0,Math.min(BT()-1,e.s+(op=='r'?sn:-sn)));evClean(L,e)}
else if(op=='up'||op=='dn'){if(!e.rest){const i=rows.findIndex(r=>r.n==e.n),j=Math.max(0,Math.min(rows.length-1,i+(op=='up'?-1:1)));e.n=rows[j].n}}
else if(op=='dup'){const n={...e};delete n.tie;n.s=e.s+e.d;if(n.s<BT()){L.push(n);evClean(L,n)}else toast('No hay espacio en el compás')}
L.sort((a,b)=>a.s-b.s);if(EV.sel)EV.sel.i=Math.max(0,L.indexOf(e));render()}
